<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>OG Cover Generator — Timeless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #07090f;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #f0e6d3;
    }

    /* starfield-style radial glow */
    .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 600px at 50% 40%,
          rgba(200,145,43,0.13) 0%,
          rgba(26,80,120,0.10) 45%,
          transparent 70%),
        radial-gradient(ellipse 400px 400px at 15% 80%,
          rgba(14,124,123,0.08) 0%,
          transparent 60%),
        radial-gradient(ellipse 300px 300px at 85% 20%,
          rgba(200,145,43,0.06) 0%,
          transparent 60%);
      pointer-events: none;
    }

    /* subtle star dots */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 120px 80px,  rgba(240,230,211,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 380px 160px, rgba(240,230,211,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 720px 50px,  rgba(240,230,211,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 900px 200px, rgba(240,230,211,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 1050px 90px, rgba(240,230,211,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 200px 400px, rgba(240,230,211,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 580px 520px, rgba(240,230,211,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 1100px 450px,rgba(240,230,211,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 850px 580px, rgba(240,230,211,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 60px 560px,  rgba(240,230,211,0.3) 0%, transparent 100%);
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 60px 80px;
      text-align: center;
      z-index: 1;
    }

    /* top border line, gold */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, rgba(200,145,43,0.8) 30%, rgba(200,145,43,0.8) 70%, transparent 100%);
    }

    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(240,230,211,0.55);
      margin-bottom: 40px;
    }
    .logo span { color: #c8912b; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(200,145,43,0.35);
      background: rgba(200,145,43,0.08);
      color: #c8912b;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 100px;
      margin-bottom: 28px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #c8912b;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 5.4rem;
      line-height: 1.05;
      letter-spacing: 0.01em;
      color: #f0e6d3;
      margin-bottom: 24px;
    }
    h1 em {
      font-style: italic;
      color: #c8912b;
    }

    .sub {
      font-size: 1.2rem;
      font-weight: 300;
      color: rgba(240,230,211,0.55);
      line-height: 1.6;
      max-width: 560px;
      margin-bottom: 44px;
    }

    .url-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(240,230,211,0.05);
      border: 1px solid rgba(240,230,211,0.1);
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 0.82rem;
      color: rgba(240,230,211,0.4);
      letter-spacing: 0.04em;
    }
    .url-badge span { color: rgba(200,145,43,0.7); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="stars"></div>

  <div class="card">
    <div class="logo">TIMELESS<span>.</span></div>

    <div class="badge">
      <span class="badge-dot"></span>
      Recepcionista virtual IA · 24/7
    </div>

    <h1>Emma atiende 24/7.<br><em>Vos dormís.</em></h1>

    <p class="sub">
      Asistente virtual con el nombre, personalidad y conocimiento de tu negocio.<br>
      Para hoteles boutique que no pueden perderse ni un mensaje.
    </p>

    <div class="url-badge">
      <span>→</span> timelessai.pro<span>/demo</span>
    </div>
  </div>
</body>
</html>
